name: Build, Test and Deploy to Azure

on:
  push:
    branches: [ "main" ]

env:
  AZURE_WEBAPP_NAME: 'tu-app-taskmanager-api' # Reemplaza esto con el nombre exacto de tu Web App en Azure
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Publish API
      run: dotnet publish src/TaskManager.Api/TaskManager.Api.csproj -c Release -o ./publish

    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: net-app
        path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: net-app
        path: ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
